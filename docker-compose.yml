services:
  sentinel:
    build: .
    image: sentinel-soc:latest
    container_name: sentinel-soc
    ports:
      - "8080:5000"
    environment:
      - DB_PATH=/data/sentinel.db
      - SECRET_KEY=change-this-secret
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
